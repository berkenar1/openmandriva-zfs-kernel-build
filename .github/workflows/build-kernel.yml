name: Build and Sign Kernel & ZFS Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Compiler Cache (ccache)
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Create Cache Directory
        run: mkdir -p .ccache

      - name: Build Custom Docker Builder Image
        run: |
          docker build -t openmandriva-zfs-builder:latest .

      - name: Run Build in OpenMandriva Container
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          docker run --privileged \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/.ccache:/root/.ccache \
            -w /workspace \
            -e GPG_PRIVATE_KEY \
            -e GPG_KEY_ID \
            openmandriva-zfs-builder:latest \
            /bin/bash ./ci_build.sh

      - name: Upload Repository Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'repo'

  deploy-pages:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
